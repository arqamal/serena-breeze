<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF;
    --off-white: #F7F6F4;
    --border: #E0DDD8;
    --mid: #B0AA9F;
    --slate-gray: #6B7280;
    --text: #2A2520;
    --black: #111111;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Roboto', sans-serif; background: var(--white); color: var(--text); font-size: 14px; }

  .step-nav-wrap { border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 100; background: var(--white); }
  .step-nav-wrap::-webkit-scrollbar { display: none; }
  .step-nav { display: flex; padding: 0 48px; min-width: max-content; }
  .snav-item { padding: 14px 20px; font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mid); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .2s; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .snav-item:hover { color: var(--text); }
  .snav-item.active { color: var(--black); border-bottom-color: var(--black); }

  main { max-width: 1080px; margin: 0 auto; padding: 48px 48px 80px; }
  .sec-eyebrow { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); margin-bottom: 10px; }
  .sec-title { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 400; text-transform: uppercase; color: var(--black); margin-bottom: 12px; letter-spacing: 1px; }
  .sec-desc { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 300; color: var(--slate-gray); line-height: 1.7; max-width: 600px; margin-bottom: 36px; }

  /* TABLE */
  .extras-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  .extras-table th { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--slate-gray); text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border); font-weight: 400; white-space: nowrap; }
  .extras-table th.tr { text-align: right; width: 140px; }
  .extras-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .extras-table tr:last-child td { border-bottom: none; }
  .extras-table tr:hover td { background: var(--off-white); }
  .extra-name { font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--text); font-weight: 400; }
  .extra-subline { font-family: 'Roboto', sans-serif; font-size: 11px; color: var(--slate-gray); margin-top: 3px; padding-left: 8px; }
  .extra-desc { font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--slate-gray); font-weight: 300; }
  .extra-comment { font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--text); font-weight: 300; }
  .extra-price { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--black); text-align: right; display: block; }
  .extra-price.consultar { font-family: 'Roboto', sans-serif; font-size: 11px; color: var(--mid); font-style: italic; }

  /* NAV */
  .nav-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
  .btn { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; padding: 14px 32px; border: none; transition: all .2s; }
  .btn-back { background: transparent; color: var(--slate-gray); border: 1px solid var(--border); }
  .btn-back:hover { border-color: var(--black); color: var(--black); }
  .btn-next { background: var(--black); color: white; }
  .btn-next:hover { background: #333; }

  .step { display: none; }
  .step.active { display: block; }

  .lang-toggle { position: fixed; top: 52px; right: 16px; z-index: 10000; display: none; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: white; }
  .lang-toggle.visible { display: flex; }
  .lang-btn { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 1px; padding: 6px 12px; cursor: pointer; border: none; background: transparent; color: var(--slate-gray); transition: all .2s; }
  .lang-btn.active { background: var(--black); color: white; }

  @media (max-width: 768px) {
    main { padding-left: 16px; padding-right: 16px; }
    .step-nav { padding: 0 16px; }
  }

  /* ── LOGIN ── */
  #login-screen {
    position: fixed; inset: 0; background: var(--white);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .login-box {
    width: 100%; max-width: 380px; padding: 48px 40px;
    border: 1px solid var(--border);
  }
  .login-logo {
    font-family: 'Oswald', sans-serif; font-size: 18px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--black);
    margin-bottom: 6px;
  }
  .login-sub {
    font-family: 'Roboto', sans-serif; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--mid);
    margin-bottom: 40px;
  }
  .login-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .login-label {
    font-family: 'Roboto', sans-serif; font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray);
  }
  .login-input {
    border: 1px solid var(--border); padding: 12px 14px;
    font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 300;
    color: var(--text); background: var(--white); outline: none;
    transition: border-color .2s; border-radius: 0; width: 100%;
  }
  .login-input:focus { border-color: var(--black); }
  .login-btn {
    width: 100%; margin-top: 8px;
    font-family: 'Oswald', sans-serif; font-size: 12px;
    letter-spacing: 3px; text-transform: uppercase;
    background: var(--black); color: white; border: none;
    padding: 14px; cursor: pointer; transition: background .2s;
  }
  .login-btn:hover { background: #333; }
  .login-btn:disabled { opacity: .55; cursor: default; }
  .login-btn:disabled:hover { background: var(--black); }
  .login-error {
    font-family: 'Roboto', sans-serif; font-size: 12px;
    color: #c0392b; margin-top: 14px; text-align: center;
    display: none;
  }
  #app-wrapper { display: none; }
</style>
</head>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Serena Breeze</div>
    <div class="login-sub">Consulta de precios de extras · Uso interno</div>
    <div class="login-field">
      <label class="login-label">Usuario</label>
      <input class="login-input" id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    </div>
    <div class="login-field">

      <input class="login-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">

    <button class="login-btn" id="login-btn" onclick="doLogin()">Acceder →</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>

</div>

<div class="lang-toggle">

<div id="app-wrapper">

const LOGIN_URL = 'https://script.google.com/macros/s/AKfycbzC9AI5br9PbD6cwCN0ombsIE7HYdIK7Uz3QoGiSZ_QHVhz8FsGJLvfJfkU51DBbL4H/exec';

let LANG = 'es';
let currentStep = 1;

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  const textoOriginal = btn ? btn.textContent : '';
  if (btn) {
    btn.disabled = true;
    btn.textContent = (LANG === 'es' ? 'Comprobando…' : 'Checking…');
  }

  fetch(LOGIN_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'login', usuario: u, pass: p, herramienta: 'consulta-extras' })
  })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
        document.querySelector('.lang-toggle').classList.add('visible');
        buildDOM();
        sendHeight();
      } else if (data.motivo === 'sin_acceso') {
        errorEl.textContent = (LANG === 'es' ? 'Tu usuario no tiene acceso a esta herramienta.' : 'Your user does not have access to this tool.');
        errorEl.style.display = 'block';
      } else {
        errorEl.textContent = (LANG === 'es' ? 'Usuario o contraseña incorrectos' : 'Incorrect username or password');
        errorEl.style.display = 'block';
      }
    })
    .catch(() => {
      errorEl.textContent = (LANG === 'es' ? 'No se pudo comprobar el acceso. Inténtalo de nuevo.' : 'Could not verify access. Please try again.');
      errorEl.style.display = 'block';
    })
    .finally(() => {
      if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
    });
}

// ─── RENDER ────────────────────────────────────────────────────────
function fmtEur(n) {
  return n.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' €';
}

function buildDOM() {
  // Nav
  const nav = document.getElementById('stepNav');
  nav.innerHTML = '';
  AREAS.forEach(area => {
    const div = document.createElement('div');
    div.className = 'snav-item' + (area.step === 1 ? ' active' : '');
    div.dataset.step = area.step;
    div.onclick = () => goTo(area.step);
    div.innerHTML = `<span data-navkey="${area.key}">${LANG==='es'?area.nav_es:area.nav_en}</span>`;
    nav.appendChild(div);
  });

  // Steps
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '';
  AREAS.forEach(area => {
    const div = document.createElement('div');
    div.className = 'step' + (area.step === 1 ? ' active' : '');
    div.id = 'step-' + area.step;

    const theadRow = `<thead><tr>
      <th>${LANG==='es'?'Descripción':'Description'}</th>
      <th>${LANG==='es'?'Notas':'Notes'}</th>
      <th>${LANG==='es'?'Notas extra':'Extra notes'}</th>
      <th class="tr">${LANG==='es'?'Precio unit. (€)':'Unit price (€)'}</th>
    </tr></thead>`;

    let rowsHTML = '';
    area.items.forEach(item => {
      const name = LANG === 'es' ? item.name_es : item.name_en;
      const desc = LANG === 'es' ? item.desc_es : item.desc_en;
      const comment = LANG === 'es' ? (item.comment_es || '') : (item.comment_en || '');
      const isConsultar = item.price === null || item.price === undefined;
      const sublines = item.sublines || [];
      rowsHTML += `
      <tr>
        <td>
          <div class="extra-name">${name}</div>
          ${sublines.length ? sublines.map(s => {
            const sname = LANG==='es' ? s.name_es : s.name_en;
            const sdesc = LANG==='es' ? (s.desc_es||'') : (s.desc_en||'');
            return `<div class="extra-subline">↳ ${sname}${sdesc ? `<span class="extra-desc" style="display:inline;margin-left:6px;">${sdesc}</span>` : ''}</div>`;
          }).join('') : ''}
        </td>
        <td><span class="extra-desc">${desc || '—'}</span></td>
        <td><span class="extra-comment">${comment || '—'}</span></td>
        <td>
          <span class="extra-price ${isConsultar?'consultar':''}">
            ${isConsultar ? (LANG==='es'?'Consultar precio':'Price on request') : fmtEur(item.price)}
          </span>
        </td>
      </tr>`;
    });

    const isFirst = area.step === 1;
    const isLast = area.step === AREAS.length;

    div.innerHTML = `
      <div class="sec-eyebrow">${String(area.step).padStart(2,'0')} — ${LANG==='es'?'Extras':'Extras'}</div>
      <h2 class="sec-title">${LANG==='es'?area.label_es:area.label_en}</h2>
      <p class="sec-desc">${LANG==='es'?area.desc_es:area.desc_en}</p>
      <table class="extras-table">${theadRow}<tbody>${rowsHTML}</tbody></table>
      <div class="nav-btns">
        ${!isFirst ? `<button class="btn btn-back" onclick="prev(${area.step})">${LANG==='es'?'← Anterior':'← Back'}</button>` : '<div></div>'}
        ${!isLast ? `<button class="btn btn-next" onclick="next(${area.step})">${LANG==='es'?'Siguiente →':'Next →'}</button>` : '<div></div>'}
      </div>`;
    container.appendChild(div);
  });
}

// ─── NAVIGATION ─────────────────────────────────────────────────────
function goTo(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  const t = document.getElementById('step-' + n);
  if (t) t.classList.add('active');
  document.querySelectorAll('.snav-item').forEach(i => {
    i.classList.remove('active');
    if (parseInt(i.dataset.step) === n) i.classList.add('active');
  });
  currentStep = n;
  sendHeight();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function next(step) { goTo(step + 1); }
function prev(step) { goTo(step - 1); }

// ─── LANG ────────────────────────────────────────────────────────────
function setLang(lang) {
  LANG = lang;
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  const wasStep = currentStep;
  buildDOM();
  goTo(wasStep);
}

// ─── UTILS ──────────────────────────────────────────────────────────
function sendHeight() {
  window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
}
window.addEventListener('resize', sendHeight);
</script>
