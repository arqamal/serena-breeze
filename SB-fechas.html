<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serena Breeze — Seguimiento de fechas</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF;
    --off-white: #F7F6F4;
    --border: #E0DDD8;
    --mid: #B0AA9F;
    --slate-gray: #6B7280;
    --text: #2A2520;
    --black: #111111;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Roboto', sans-serif; background: var(--white); color: var(--text); font-size: 14px; overscroll-behavior-y: contain; }

  main { max-width: 1080px; margin: 0 auto; padding: 40px 48px 80px; }
  .sec-eyebrow { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); margin-bottom: 10px; }
  .sec-title { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 400; text-transform: uppercase; color: var(--black); margin-bottom: 12px; letter-spacing: 1px; }
  .sec-desc { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 300; color: var(--slate-gray); line-height: 1.7; max-width: 640px; margin-bottom: 28px; }

  /* BREADCRUMB */
  .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-family: 'Roboto', sans-serif; font-size: 12px; letter-spacing: .5px; }
  .crumb { color: var(--slate-gray); cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; }
  .crumb:hover { color: var(--black); text-decoration: underline; }
  .crumb.current { color: var(--black); font-weight: 400; cursor: default; }
  .crumb.current:hover { text-decoration: none; }
  .crumb-sep { color: var(--mid); }

  /* LOAD / EMPTY / READONLY BANNER */
  #load-indicator { display: none; font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--slate-gray); padding: 8px 16px; background: var(--off-white); border: 1px solid var(--border); margin-bottom: 20px; letter-spacing: .5px; }
  #load-indicator.err { color: #c0392b; background: #fdf0ee; border-color: #f0c4bc; }
  .readonly-banner { display: none; font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--slate-gray); padding: 10px 16px; background: var(--off-white); border: 1px solid var(--border); margin-bottom: 24px; letter-spacing: .3px; }
  .readonly-banner.show { display: block; }

  /* NIVEL 1 — TARJETAS DE PROMOCIÓN */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 8px; }
  .level-card { border: 1px solid var(--border); background: var(--white); }
  .level-card-head { padding: 18px 22px; background: var(--off-white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .level-card-title { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--black); text-transform: uppercase; }
  .level-card-nav { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate-gray); background: var(--white); border: 1px solid var(--border); padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .level-card-nav:hover { border-color: var(--black); color: var(--black); }
  .level-card-body { padding: 18px 22px 22px; }

  /* GRID DE CAMPOS (label + valor/input) */
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .field-item { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate-gray); }
  .field-value { font-family: 'Roboto', sans-serif; font-size: 14px; color: var(--text); padding: 8px 0; min-height: 20px; }
  .field-value.empty { color: var(--mid); font-style: italic; }
  .field-input { border: 1px solid var(--border); padding: 8px 10px; font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--text); background: var(--white); outline: none; border-radius: 0; width: 100%; }
  .field-input:focus { border-color: var(--black); }
  .field-input.saving { opacity: .5; }
  .field-input.err-flash { border-color: #c0392b; outline: 2px solid #f0c4bc; outline-offset: 1px; }
  .field-input.saved-flash { border-color: #2d7a2d; }

  /* NIVEL 3 — TABLA DE VIVIENDAS */
  .vivienda-table-wrap { border: 1px solid var(--border); }
  .vivienda-table { width: 100%; border-collapse: collapse; }
  .vivienda-table th { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--slate-gray); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--off-white); font-weight: 400; white-space: nowrap; }
  .vivienda-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .vivienda-table tr:last-child td { border-bottom: none; }
  .vivienda-table td.vcode { font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: .5px; color: var(--black); white-space: nowrap; }
  .vivienda-table input.field-input { min-width: 130px; }

  .add-vivienda-row { display: flex; align-items: flex-end; gap: 10px; padding: 16px 12px; border-top: 1px solid var(--border); background: var(--off-white); flex-wrap: wrap; }
  .add-vivienda-row .field-item { min-width: 140px; }
  .add-vivienda-btn { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; background: var(--black); color: white; border: none; padding: 10px 20px; cursor: pointer; height: 36px; }
  .add-vivienda-btn:hover { background: #333; }
  .add-vivienda-btn:disabled { opacity: .5; cursor: default; }

  #empty-state { display: none; font-family: 'Roboto', sans-serif; font-size: 14px; color: var(--slate-gray); padding: 32px; text-align: center; border: 1px solid var(--border); }

  /* LOGIN (idéntico al resto de herramientas SB) */
  #login-screen { position: fixed; inset: 0; background: var(--white); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { width: 100%; max-width: 380px; padding: 48px 40px; border: 1px solid var(--border); }
  .login-logo { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--black); margin-bottom: 6px; }
  .login-sub { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mid); margin-bottom: 40px; }
  .login-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .login-label { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); }
  .login-input { border: 1px solid var(--border); padding: 12px 14px; font-family: 'Roboto', sans-serif; font-size: 14px; color: var(--text); background: var(--white); outline: none; border-radius: 0; width: 100%; }
  .login-input:focus { border-color: var(--black); }
  .login-btn { width: 100%; margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; background: var(--black); color: white; border: none; padding: 14px; cursor: pointer; transition: background .2s; }
  .login-btn:hover { background: #333; }
  .login-btn:disabled { opacity: .55; cursor: default; }
  .login-btn:disabled:hover { background: var(--black); }
  .login-error { font-family: 'Roboto', sans-serif; font-size: 12px; color: #c0392b; margin-top: 14px; text-align: center; display: none; }

  #app-wrapper { display: none; }

  @media (max-width: 768px) {
    main { padding-left: 16px; padding-right: 16px; }
    .field-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Serena Breeze</div>
    <div class="login-sub">Seguimiento de fechas · Uso interno</div>
    <div class="login-field">
      <label class="login-label">Usuario</label>
      <input class="login-input" id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    </div>
    <div class="login-field">
      <label class="login-label">Contraseña</label>
      <input class="login-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Acceder →</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
  </div>
</div>

<div id="app-wrapper">
  <main>
    <div class="sec-eyebrow">Serena Breeze · Obra</div>
    <div class="sec-title">Seguimiento de fechas</div>
    <div class="sec-desc">Fechas clave de cada promoción, bloque y vivienda: licencia, inicio, bloqueos de extras y entregas.</div>

    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="load-indicator"></div>
    <div class="readonly-banner" id="readonly-banner">Tu usuario solo puede consultar esta pantalla, no editar fechas.</div>
    <div id="empty-state"></div>

    <div id="view-nivel1" class="card-grid"></div>
    <div id="view-nivel2" class="card-grid" style="display:none"></div>
    <div id="view-nivel3" style="display:none"></div>
  </main>
</div>

<script>
// ─── LOGIN ─────────────────────────────────────────────────────
// Mismo Web App que el resto de herramientas (AuthUsuarios.gs), login centralizado.
const LOGIN_URL = 'https://script.google.com/macros/s/AKfycbzC9AI5br9PbD6cwCN0ombsIE7HYdIK7Uz3QoGiSZ_QHVhz8FsGJLvfJfkU51DBbL4H/exec';

// URL del Web App nuevo GeneradorFechas.gs — sustituir tras desplegarlo.
const FECHAS_URL = 'PENDIENTE_DESPLEGAR_GeneradorFechas';

let USER_ROL = null;

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  const textoOriginal = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Comprobando…'; }

  fetch(LOGIN_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'login', usuario: u, pass: p, herramienta: 'fechas' })
  })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        USER_ROL = data.rol || null;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
        document.getElementById('readonly-banner').classList.toggle('show', !puedeEditarNivel('promocion') && !puedeEditarNivel('bloque') && !puedeEditarNivel('vivienda'));
        cargarDatos();
      } else if (data.motivo === 'sin_acceso') {
        errorEl.textContent = 'Tu usuario no tiene acceso a esta herramienta.';
        errorEl.style.display = 'block';
      } else {
        errorEl.textContent = 'Usuario o contraseña incorrectos';
        errorEl.style.display = 'block';
      }
    })
    .catch(() => {
      errorEl.textContent = 'No se pudo comprobar el acceso. Inténtalo de nuevo.';
      errorEl.style.display = 'block';
    })
    .finally(() => {
      if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
    });
}

['login-user', 'login-pass'].forEach(id => {
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  });
});

// ─── PERMISOS POR ROL (mismos que valida GeneradorFechas.gs en servidor) ─
const PERMISOS_NIVEL = {
  promocion: ['arquitectura'],
  bloque: ['arquitectura', 'tec'],
  vivienda: ['arquitectura']
};
function puedeEditarNivel(nivel) {
  return (PERMISOS_NIVEL[nivel] || []).indexOf(USER_ROL) !== -1;
}

// ─── CAMPOS POR NIVEL ────────────────────────────────────────────
const FIELDS_PROMOCION = [
  { key: 'num_apartamentos', label: 'Nº apartamentos', type: 'number' },
  { key: 'num_villas', label: 'Nº villas', type: 'number' },
  { key: 'fecha_licencia', label: 'Fecha licencia', type: 'date' },
  { key: 'fecha_inicio', label: 'Fecha inicio', type: 'date' },
  { key: 'fecha_fin_estimada', label: 'Fecha fin estimada', type: 'date' },
  { key: 'fecha_fin_real', label: 'Fecha fin real', type: 'date' }
];
const FIELDS_BLOQUE = [
  { key: 'num_viviendas', label: 'Nº viviendas', type: 'number' },
  { key: 'fecha_inicio', label: 'Fecha inicio', type: 'date' },
  { key: 'fecha_bloqueo_estructura', label: 'Bloqueo estructura', type: 'date' },
  { key: 'fecha_bloqueo_albanileria', label: 'Bloqueo albañilería', type: 'date' },
  { key: 'fecha_bloqueo_instalaciones', label: 'Bloqueo instalaciones', type: 'date' },
  { key: 'fecha_bloqueo_materiales', label: 'Bloqueo elección materiales', type: 'date' },
  { key: 'fecha_bloqueo_acabados', label: 'Bloqueo acabados', type: 'date' },
  { key: 'fecha_bloqueo_equipamiento', label: 'Bloqueo equipamiento', type: 'date' },
  { key: 'fecha_entrega_bloque', label: 'Entrega de bloque', type: 'date' }
];
const FIELDS_VIVIENDA = [
  { key: 'fecha_inicio', label: 'Fecha inicio', type: 'date' },
  { key: 'fecha_fin_estimada', label: 'Fecha fin estimada', type: 'date' },
  { key: 'fecha_fin_real', label: 'Fecha fin real', type: 'date' },
  { key: 'fecha_escritura', label: 'Fecha escritura', type: 'date' }
];

const PROMOCIONES_FIJAS = [
  { codigo: '2SB', nombre: 'Serena Breeze 2' },
  { codigo: '3SB', nombre: 'Serena Breeze 3' }
];
const BLOQUES_FIJOS = ['Villas', 'Apartamentos'];

// ─── ESTADO ──────────────────────────────────────────────────────
let DATA_PROMOCIONES = [];
let DATA_BLOQUES = [];
let DATA_VIVIENDAS = [];
let ESTADO = { promo: null, bloque: null };

function cargarDatos() {
  const ind = document.getElementById('load-indicator');
  ind.className = ''; ind.style.display = 'block';
  ind.textContent = 'Cargando…';

  if (FECHAS_URL.indexOf('PENDIENTE_DESPLEGAR') === 0) {
    ind.className = 'err';
    ind.textContent = 'Falta desplegar GeneradorFechas.gs y sustituir FECHAS_URL en el código. Ver comentario junto a la constante.';
    return;
  }

  fetch(FECHAS_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'consultar' })
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'respuesta sin ok:true');
      DATA_PROMOCIONES = data.promociones || [];
      DATA_BLOQUES = data.bloques || [];
      DATA_VIVIENDAS = data.viviendas || [];
      ind.style.display = 'none';
      renderBreadcrumb();
      renderNivel1();
    })
    .catch(e => {
      ind.className = 'err';
      ind.textContent = 'Error al cargar los datos: ' + e.message;
    });
}

// ─── NAVEGACIÓN ──────────────────────────────────────────────────
function irANivel1() {
  ESTADO = { promo: null, bloque: null };
  mostrarSolo('view-nivel1');
  renderBreadcrumb();
  renderNivel1();
}
function irANivel2(promoCodigo) {
  ESTADO.promo = promoCodigo;
  ESTADO.bloque = null;
  mostrarSolo('view-nivel2');
  renderBreadcrumb();
  renderNivel2();
}
function irANivel3(tipoBloque) {
  ESTADO.bloque = tipoBloque;
  mostrarSolo('view-nivel3');
  renderBreadcrumb();
  renderNivel3();
}
function mostrarSolo(idVisible) {
  ['view-nivel1', 'view-nivel2', 'view-nivel3'].forEach(id => {
    document.getElementById(id).style.display = (id === idVisible) ? (id === 'view-nivel3' ? 'block' : 'grid') : 'none';
  });
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const promoNombre = ESTADO.promo ? (PROMOCIONES_FIJAS.find(p => p.codigo === ESTADO.promo) || {}).nombre : null;
  let html = '<span class="crumb' + (!ESTADO.promo ? ' current' : '') + '" onclick="irANivel1()">Promociones</span>';
  if (ESTADO.promo) {
    html += '<span class="crumb-sep">/</span>';
    html += '<span class="crumb' + (!ESTADO.bloque ? ' current' : '') + '" onclick="irANivel2(\'' + ESTADO.promo + '\')">' + escapeHtml(promoNombre || ESTADO.promo) + '</span>';
  }
  if (ESTADO.bloque) {
    html += '<span class="crumb-sep">/</span>';
    html += '<span class="crumb current">' + escapeHtml(ESTADO.bloque) + '</span>';
  }
  el.innerHTML = html;
}

// ─── NIVEL 1 — PROMOCIONES ─────────────────────────────────────
function renderNivel1() {
  const cont = document.getElementById('view-nivel1');
  const puedeEditar = puedeEditarNivel('promocion');
  cont.innerHTML = PROMOCIONES_FIJAS.map(p => {
    const registro = DATA_PROMOCIONES.find(r => r.promocion === p.codigo) || { promocion: p.codigo };
    return '' +
      '<div class="level-card">' +
        '<div class="level-card-head">' +
          '<div class="level-card-title">' + escapeHtml(p.nombre) + '</div>' +
          '<button class="level-card-nav" onclick="irANivel2(\'' + p.codigo + '\')">Ver bloques →</button>' +
        '</div>' +
        '<div class="level-card-body">' +
          renderFieldGrid(FIELDS_PROMOCION, registro, puedeEditar, campos => guardarPromocion(p.codigo, campos)) +
        '</div>' +
      '</div>';
  }).join('');
}

function guardarPromocion(promoCodigo, campos) {
  return llamarGuardar({ accion: 'guardar_promocion', rol: USER_ROL, promocion: promoCodigo, campos: campos })
    .then(() => {
      let registro = DATA_PROMOCIONES.find(r => r.promocion === promoCodigo);
      if (!registro) { registro = { promocion: promoCodigo }; DATA_PROMOCIONES.push(registro); }
      Object.assign(registro, campos);
    });
}

// ─── NIVEL 2 — BLOQUES (villas / apartamentos) ─────────────────
function renderNivel2() {
  const cont = document.getElementById('view-nivel2');
  const puedeEditar = puedeEditarNivel('bloque');
  cont.innerHTML = BLOQUES_FIJOS.map(tipo => {
    const registro = DATA_BLOQUES.find(r => r.promocion === ESTADO.promo && r.tipo === tipo) || { promocion: ESTADO.promo, tipo: tipo };
    return '' +
      '<div class="level-card">' +
        '<div class="level-card-head">' +
          '<div class="level-card-title">' + escapeHtml(tipo) + '</div>' +
          '<button class="level-card-nav" onclick="irANivel3(\'' + tipo + '\')">Ver viviendas →</button>' +
        '</div>' +
        '<div class="level-card-body">' +
          renderFieldGrid(FIELDS_BLOQUE, registro, puedeEditar, campos => guardarBloque(tipo, campos)) +
        '</div>' +
      '</div>';
  }).join('');
}

function guardarBloque(tipo, campos) {
  return llamarGuardar({ accion: 'guardar_bloque', rol: USER_ROL, promocion: ESTADO.promo, tipo: tipo, campos: campos })
    .then(() => {
      let registro = DATA_BLOQUES.find(r => r.promocion === ESTADO.promo && r.tipo === tipo);
      if (!registro) { registro = { promocion: ESTADO.promo, tipo: tipo }; DATA_BLOQUES.push(registro); }
      Object.assign(registro, campos);
    });
}

// ─── NIVEL 3 — VIVIENDAS ─────────────────────────────────────
function renderNivel3() {
  const cont = document.getElementById('view-nivel3');
  const puedeEditar = puedeEditarNivel('vivienda');
  const viviendas = DATA_VIVIENDAS
    .filter(r => r.promocion === ESTADO.promo && r.bloque === ESTADO.bloque)
    .sort((a, b) => String(a.vivienda).localeCompare(String(b.vivienda), 'es', { numeric: true }));

  let html = '<div class="vivienda-table-wrap"><table class="vivienda-table"><thead><tr>';
  html += '<th>Vivienda</th>';
  FIELDS_VIVIENDA.forEach(f => { html += '<th>' + escapeHtml(f.label) + '</th>'; });
  html += '</tr></thead><tbody id="vivienda-tbody">';

  if (!viviendas.length) {
    html += '<tr><td colspan="' + (FIELDS_VIVIENDA.length + 1) + '" style="color:var(--slate-gray); font-style:italic; padding:20px 12px;">Todavía no hay viviendas registradas en este bloque.</td></tr>';
  } else {
    viviendas.forEach(v => {
      html += '<tr>';
      html += '<td class="vcode">' + escapeHtml(v.vivienda) + '</td>';
      FIELDS_VIVIENDA.forEach(f => {
        html += '<td>' + renderCampoCelda(f, v[f.key], puedeEditar, campos => guardarVivienda(v.vivienda, campos)) + '</td>';
      });
      html += '</tr>';
    });
  }
  html += '</tbody></table>';

  if (puedeEditar) {
    html += '' +
      '<div class="add-vivienda-row">' +
        '<div class="field-item"><label class="field-label">Nueva vivienda</label>' +
          '<input class="field-input" id="nueva-vivienda-codigo" type="text" placeholder="p.ej. 2SB5"></div>' +
        '<button class="add-vivienda-btn" onclick="anadirVivienda()">+ Añadir</button>' +
      '</div>';
  }
  html += '</div>';

  cont.innerHTML = html;
}

function anadirVivienda() {
  const input = document.getElementById('nueva-vivienda-codigo');
  const codigo = (input.value || '').trim();
  if (!codigo) { input.focus(); return; }
  if (DATA_VIVIENDAS.some(r => r.promocion === ESTADO.promo && r.bloque === ESTADO.bloque && r.vivienda === codigo)) {
    alert('Esa vivienda ya existe en este bloque.');
    return;
  }
  const btn = document.querySelector('.add-vivienda-btn');
  if (btn) btn.disabled = true;
  llamarGuardar({ accion: 'guardar_vivienda', rol: USER_ROL, promocion: ESTADO.promo, bloque: ESTADO.bloque, vivienda: codigo, campos: {} })
    .then(() => {
      DATA_VIVIENDAS.push({ promocion: ESTADO.promo, bloque: ESTADO.bloque, vivienda: codigo });
      renderNivel3();
    })
    .catch(e => alert('No se pudo añadir la vivienda: ' + e.message))
    .finally(() => { if (btn) btn.disabled = false; });
}

function guardarVivienda(codigoVivienda, campos) {
  return llamarGuardar({ accion: 'guardar_vivienda', rol: USER_ROL, promocion: ESTADO.promo, bloque: ESTADO.bloque, vivienda: codigoVivienda, campos: campos })
    .then(() => {
      let registro = DATA_VIVIENDAS.find(r => r.promocion === ESTADO.promo && r.bloque === ESTADO.bloque && r.vivienda === codigoVivienda);
      if (!registro) { registro = { promocion: ESTADO.promo, bloque: ESTADO.bloque, vivienda: codigoVivienda }; DATA_VIVIENDAS.push(registro); }
      Object.assign(registro, campos);
    });
}

// ─── RENDER DE CAMPOS (genérico, niveles 1 y 2) ─────────────────
function renderFieldGrid(fields, registro, puedeEditar, onSave) {
  let html = '<div class="field-grid">';
  fields.forEach(f => {
    html += '<div class="field-item"><label class="field-label">' + escapeHtml(f.label) + '</label>';
    html += renderCampoCelda(f, registro[f.key], puedeEditar, campos => onSave(campos));
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// Devuelve el HTML de un único campo (input editable o texto plano),
// con guardado on-blur/on-change y feedback visual de guardado/error.
let CAMPO_SEQ = 0;
function renderCampoCelda(field, valor, puedeEditar, onSave) {
  const id = 'campo-' + (CAMPO_SEQ++);
  if (!puedeEditar) {
    const vacio = (valor === undefined || valor === null || valor === '');
    return '<div class="field-value' + (vacio ? ' empty' : '') + '">' + (vacio ? 'Sin definir' : escapeHtml(formatearValorMostrado(field, valor))) + '</div>';
  }
  const valorAttr = (valor === undefined || valor === null) ? '' : escapeAttr(valor);
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener(field.type === 'date' ? 'change' : 'blur', () => {
      const nuevoValor = field.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
      el.classList.add('saving');
      el.classList.remove('err-flash', 'saved-flash');
      const campos = {}; campos[field.key] = nuevoValor;
      onSave(campos)
        .then(() => {
          el.classList.remove('saving');
          el.classList.add('saved-flash');
          setTimeout(() => el.classList.remove('saved-flash'), 1200);
        })
        .catch(e => {
          console.error('Error al guardar ' + field.key + ':', e);
          el.classList.remove('saving');
          el.classList.add('err-flash');
          setTimeout(() => el.classList.remove('err-flash'), 2500);
        });
    });
  }, 0);
  return '<input class="field-input" id="' + id + '" type="' + field.type + '" value="' + valorAttr + '">';
}

function formatearValorMostrado(field, valor) {
  if (field.type === 'date') return formatearFechaES(valor);
  return valor;
}
function formatearFechaES(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return iso || '';
  const [y, m, d] = String(iso).split('-');
  return d + '/' + m + '/' + y;
}

// ─── LLAMADA GENÉRICA DE GUARDADO ────────────────────────────────
function llamarGuardar(payload) {
  return fetch(FECHAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!data || data.ok !== true) throw new Error((data && data.motivo) || 'respuesta sin ok:true');
      return data;
    });
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
</script>
