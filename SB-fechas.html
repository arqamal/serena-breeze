<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serena Breeze — Seguimiento de fechas</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF;
    --off-white: #F7F6F4;
    --border: #E0DDD8;
    --mid: #B0AA9F;
    --slate-gray: #6B7280;
    --text: #2A2520;
    --black: #111111;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Roboto', sans-serif; background: var(--white); color: var(--text); font-size: 14px; overscroll-behavior-y: contain; }

  main { max-width: 1080px; margin: 0 auto; padding: 40px 48px 80px; }
  .sec-eyebrow { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); margin-bottom: 10px; }
  .sec-title { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 400; text-transform: uppercase; color: var(--black); margin-bottom: 12px; letter-spacing: 1px; }
  .sec-desc { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 300; color: var(--slate-gray); line-height: 1.7; max-width: 640px; margin-bottom: 28px; }

  /* TOP BAR — selector de promoción, igual que el dashboard */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .promo-tabs { display: flex; border: 1px solid var(--border); }
  .promo-tab { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 28px; cursor: pointer; background: var(--white); color: var(--slate-gray); border: none; border-right: 1px solid var(--border); transition: all .15s; }
  .promo-tab:last-child { border-right: none; }
  .promo-tab.active { background: var(--black); color: white; }
  .promo-tab:hover:not(.active) { background: var(--off-white); color: var(--text); }
  .refresh-btn { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; padding: 11px 18px; background: transparent; color: var(--slate-gray); border: 1px solid var(--border); transition: all .15s; }
  .refresh-btn:hover { border-color: var(--black); color: var(--black); }

  #load-indicator { display: none; font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--slate-gray); padding: 8px 16px; background: var(--off-white); border: 1px solid var(--border); margin-bottom: 20px; letter-spacing: .5px; }
  #load-indicator.err { color: #c0392b; background: #fdf0ee; border-color: #f0c4bc; }
  #empty-state { display: none; font-family: 'Roboto', sans-serif; font-size: 14px; color: var(--slate-gray); padding: 32px; text-align: center; border: 1px solid var(--border); }

  .block-title { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .block-title:first-of-type { margin-top: 0; }

  /* BLOQUE 1 — CABECERA DE PROMOCIÓN */
  .promo-box { border: 1px solid var(--border); }
  .promo-box-head { padding: 20px 24px; background: var(--off-white); border-bottom: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .promo-name { font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--black); text-transform: uppercase; }
  .promo-counts { font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--slate-gray); }
  .promo-counts b { color: var(--text); font-weight: 400; }
  .promo-box-body { padding: 20px 24px 24px; }

  /* GRID DE CAMPOS (label + valor/input), fila horizontal */
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 20px; }
  .field-item { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate-gray); }
  .field-value { font-family: 'Roboto', sans-serif; font-size: 14px; color: var(--text); padding: 8px 0; min-height: 20px; }
  .field-value.empty { color: var(--mid); font-style: italic; }
  .field-input { border: 1px solid var(--border); padding: 8px 10px; font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--text); background: var(--white); outline: none; border-radius: 0; width: 100%; }
  .field-input:focus { border-color: var(--black); }
  .field-input.saving { opacity: .5; }
  .field-input.err-flash { border-color: #c0392b; outline: 2px solid #f0c4bc; outline-offset: 1px; }
  .field-input.saved-flash { border-color: #2d7a2d; }

  /* SEMÁFORO DE FECHAS — verde: en plazo (>1 mes) · naranja: a menos de 1 mes · rojo: vencida */
  .field-input.due-green, .field-value.due-green { background: #E9F6EA; }
  .field-input.due-orange, .field-value.due-orange { background: #FCEFD9; }
  .field-input.due-red, .field-value.due-red { background: #FBE3E1; }

  /* BLOQUE 2 — TABLA DE FASE, TRANSPUESTA (campo en filas, Villas/Apartamentos en columnas) — cabe sin scroll lateral */
  .fase-table-wrap, .viviendas-table-wrap { border: 1px solid var(--border); }
  .fase-table-wrap { margin-bottom: 28px; }
  table.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.data-table th { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--slate-gray); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--off-white); font-weight: 400; }
  table.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table td.rowlabel { font-family: 'Roboto', sans-serif; font-size: 12.5px; color: var(--slate-gray); }
  table.data-table td.vcode { font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: .5px; color: var(--black); white-space: nowrap; }
  .fase-table-wrap table.data-table th:first-child, .fase-table-wrap table.data-table td:first-child { width: 42%; }
  .field-input { min-width: 0; }

  /* BLOQUE 3 — VIVIENDAS */
  .viviendas-group { margin-bottom: 28px; }
  .viviendas-group-title { font-family: 'Oswald', sans-serif; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--black); padding: 12px 16px; background: var(--off-white); border: 1px solid var(--border); border-bottom: none; }
  .viviendas-table-wrap { overflow-x: auto; }
  .viviendas-table-wrap table.data-table { min-width: 560px; }

  /* LOGIN */
  #login-screen { position: fixed; inset: 0; background: var(--white); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { width: 100%; max-width: 380px; padding: 48px 40px; border: 1px solid var(--border); }
  .login-logo { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--black); margin-bottom: 6px; }
  .login-sub { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mid); margin-bottom: 40px; }
  .login-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .login-label { font-family: 'Roboto', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); }
  .login-input { border: 1px solid var(--border); padding: 12px 14px; font-family: 'Roboto', sans-serif; font-size: 14px; color: var(--text); background: var(--white); outline: none; border-radius: 0; width: 100%; }
  .login-input:focus { border-color: var(--black); }
  .login-btn { width: 100%; margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; background: var(--black); color: white; border: none; padding: 14px; cursor: pointer; transition: background .2s; }
  .login-btn:hover { background: #333; }
  .login-btn:disabled { opacity: .55; cursor: default; }
  .login-btn:disabled:hover { background: var(--black); }
  .login-error { font-family: 'Roboto', sans-serif; font-size: 12px; color: #c0392b; margin-top: 14px; text-align: center; display: none; }

  #app-wrapper { display: none; }

  @media (max-width: 768px) {
    main { padding-left: 16px; padding-right: 16px; }
    .fase-table-wrap table.data-table th:first-child, .fase-table-wrap table.data-table td:first-child { width: auto; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Serena Breeze</div>
    <div class="login-sub">Seguimiento de fechas · Uso interno</div>
    <div class="login-field">
      <label class="login-label">Usuario</label>
      <input class="login-input" id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    </div>
    <div class="login-field">
      <label class="login-label">Contraseña</label>
      <input class="login-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Acceder →</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
  </div>
</div>

<div id="app-wrapper">
  <main>
    <div class="sec-eyebrow">Serena Breeze · Obra</div>
    <div class="sec-title">Seguimiento de fechas</div>
    <div class="sec-desc">Fechas clave de cada promoción, fase y vivienda: licencia, inicio, bloqueos de extras y entregas.</div>

    <div class="topbar">
      <div class="promo-tabs">
        <button class="promo-tab" id="tab-1sb" onclick="switchPromo('1SB')">1SB</button>
        <button class="promo-tab" id="tab-2sb" onclick="switchPromo('2SB')">2SB</button>
        <button class="promo-tab" id="tab-3sb" onclick="switchPromo('3SB')">3SB</button>
      </div>
      <button class="refresh-btn" onclick="if (CURRENT_PROMO) cargarDatos()">↻ Actualizar</button>
    </div>

    <div id="load-indicator"></div>
    <div id="empty-state">Elige Serena Breeze 2 o Serena Breeze 3 arriba para ver sus fechas.</div>

    <div id="content" style="display:none"></div>
  </main>
</div>

<script>
// ─── LOGIN ─────────────────────────────────────────────────────
const LOGIN_URL = 'https://script.google.com/macros/s/AKfycbzC9AI5br9PbD6cwCN0ombsIE7HYdIK7Uz3QoGiSZ_QHVhz8FsGJLvfJfkU51DBbL4H/exec';
const FECHAS_URL = 'https://script.google.com/macros/s/AKfycbynWrDgP-fyWwQHuQ26LqFU0LYujR6ngtXpCmjvY_IsJRP5qf8lduWO9LcX-jZS31z_Mw/exec';

let USER_ROL = null;
let USER_LOGIN = null; // usuario tal cual lo escribió — se manda en cada guardar_* para que el backend mire sus permisos en _usuarios
let USER_PERMISOS = { promocion: false, fase: false, vivienda: false };

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  const textoOriginal = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Comprobando…'; }

  fetch(LOGIN_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'login', usuario: u, pass: p, herramienta: 'fechas' })
  })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        USER_ROL = data.rol || null;
        USER_LOGIN = u;
        // Permisos tal cual los devuelve AuthUsuarios.gs desde _usuarios —
        // aquí no hay ninguna tabla fija por rol, se confía en el servidor.
        USER_PERMISOS = {
          promocion: data.fechas_edita_promocion === true,
          fase: data.fechas_edita_fase === true,
          vivienda: data.fechas_edita_vivienda === true
        };
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
      } else if (data.motivo === 'sin_acceso') {
        errorEl.textContent = 'Tu usuario no tiene acceso a esta herramienta.';
        errorEl.style.display = 'block';
      } else {
        errorEl.textContent = 'Usuario o contraseña incorrectos';
        errorEl.style.display = 'block';
      }
    })
    .catch(() => {
      errorEl.textContent = 'No se pudo comprobar el acceso. Inténtalo de nuevo.';
      errorEl.style.display = 'block';
    })
    .finally(() => {
      if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
    });
}

['login-user', 'login-pass'].forEach(id => {
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  });
});

// Los permisos de edición NO se calculan aquí — vienen ya resueltos del login
// (AuthUsuarios.gs los lee de las columnas fechas_edita_* en _usuarios). El
// servidor de GeneradorFechas.gs los vuelve a comprobar en cada guardado por
// su cuenta, así que esto solo decide qué se pinta como input vs texto.
function puedeEditarNivel(nivel) {
  return USER_PERMISOS[nivel] === true;
}

// ─── CAMPOS POR NIVEL ────────────────────────────────────────────
const FIELDS_PROMOCION = [
  { key: 'fecha_licencia', label: 'Fecha licencia', type: 'date' },
  { key: 'fecha_inicio', label: 'Fecha inicio', type: 'date' },
  { key: 'fecha_fin_estimada', label: 'Fecha fin estimada', type: 'month', computed: true },
  { key: 'fecha_fin_real', label: 'Fecha fin real', type: 'date', computed: true }
];
const FIELDS_FASE = [
  { key: 'fecha_inicio', label: 'Fecha inicio', type: 'date' },
  { key: 'fecha_bloqueo_estructura', label: 'Bloqueo estructura', type: 'date' },
  { key: 'fecha_bloqueo_albanileria', label: 'Bloqueo albañilería', type: 'date' },
  { key: 'fecha_bloqueo_instalaciones', label: 'Bloqueo instalaciones', type: 'date' },
  { key: 'fecha_bloqueo_materiales', label: 'Bloqueo elección materiales', type: 'date' },
  { key: 'fecha_bloqueo_acabados', label: 'Bloqueo acabados', type: 'date' },
  { key: 'fecha_bloqueo_equipamiento', label: 'Bloqueo equipamiento', type: 'date' },
  { key: 'fecha_entrega', label: 'Entrega de fase', type: 'month', computed: true }
];
const FIELDS_VIVIENDA = [
  { key: 'fecha_fin_estimada', label: 'Fecha fin estimada', type: 'month', nivelPermiso: 'fase' }, // la edita quien edite Fase (arquitectura+tec), no solo Vivienda
  { key: 'fecha_cfo', label: 'CFO', type: 'date' },
  { key: 'fecha_entrega', label: 'Fecha entrega', type: 'month' },
  { key: 'fecha_escritura', label: 'Fecha escritura', type: 'date' }
];

const PROMOCIONES_FIJAS = { '1SB': 'Serena Breeze 1', '2SB': 'Serena Breeze 2', '3SB': 'Serena Breeze 3' };
const FASES_FIJAS = ['Villas', 'Apartamentos'];

// ─── ESTADO ──────────────────────────────────────────────────────
let DATA_PROMOCIONES = [];
let DATA_FASES = [];
let DATA_VIVIENDAS = [];
let CURRENT_PROMO = null;

function switchPromo(promo) {
  if (promo === CURRENT_PROMO) return;
  CURRENT_PROMO = promo;
  document.getElementById('tab-1sb').classList.toggle('active', promo === '1SB');
  document.getElementById('tab-2sb').classList.toggle('active', promo === '2SB');
  document.getElementById('tab-3sb').classList.toggle('active', promo === '3SB');
  cargarDatos();
}

function cargarDatos() {
  const ind = document.getElementById('load-indicator');
  const empty = document.getElementById('empty-state');
  const content = document.getElementById('content');
  empty.style.display = 'none';
  content.style.display = 'none';
  ind.className = ''; ind.style.display = 'block';
  ind.textContent = 'Cargando ' + CURRENT_PROMO + '…';

  fetch(FECHAS_URL, { method: 'POST', body: JSON.stringify({ accion: 'consultar', promocion: CURRENT_PROMO }) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'respuesta sin ok:true');
      DATA_PROMOCIONES = data.promociones || [];
      DATA_FASES = data.fases || [];
      DATA_VIVIENDAS = data.viviendas || [];
      ind.style.display = 'none';
      content.style.display = 'block';
      renderContenido();
    })
    .catch(e => {
      ind.className = 'err';
      ind.textContent = 'Error al cargar los datos: ' + e.message;
    });
}

// ─── RENDER PRINCIPAL — todo lo de la promoción elegida, en una página ──
function renderContenido() {
  const cont = document.getElementById('content');
  cont.innerHTML =
    renderBloque1_Promocion() +
    '<div class="block-title">Villas y apartamentos · fechas de fase</div>' +
    renderBloque2_Fases() +
    renderBloque3_Viviendas();

  activarListeners();
}

// ── contador de viviendas por fase, a partir del catálogo ya cargado ──
function contarViviendas(fase) {
  return DATA_VIVIENDAS.filter(r => r.promocion === CURRENT_PROMO && r.fase === fase).length;
}

// Fecha más tardía de una lista de viviendas para un campo dado ('' si ninguna la tiene).
function maxFechaVivienda_(viviendas, campo) {
  let mejor = null, mejorStr = '';
  viviendas.forEach(v => {
    const d = parseFechaValor_(v[campo]);
    if (d && (!mejor || d > mejor)) { mejor = d; mejorStr = v[campo]; }
  });
  return mejorStr;
}

// Igual, pero solo devuelve algo si TODAS las viviendas de la lista tienen
// ese campo relleno — si falta una sola, devuelve '' (aún no está completo).
// Usado para fin real de promoción (CFO) y entrega de fase: no tiene sentido
// dar una fecha "final" mientras quede alguna vivienda sin la suya.
function maxFechaViviendaCompleta_(viviendas, campo) {
  if (!viviendas.length) return '';
  const todasTienen = viviendas.every(v => v[campo]);
  if (!todasTienen) return '';
  return maxFechaVivienda_(viviendas, campo);
}

// ── BLOQUE 1: cabecera de promoción ──────────────────────────────
function renderBloque1_Promocion() {
  const puedeEditar = puedeEditarNivel('promocion');
  const registro = DATA_PROMOCIONES.find(r => r.promocion === CURRENT_PROMO) || { promocion: CURRENT_PROMO };
  const viviendasPromo = DATA_VIVIENDAS.filter(r => r.promocion === CURRENT_PROMO);
  const nVillas = contarViviendas('Villas');
  const nApts = contarViviendas('Apartamentos');

  // fecha_fin_estimada de promoción es calculada: la más tardía entre todas
  // las viviendas. fecha_fin_real de promoción se calcula a partir de
  // fecha_cfo de las viviendas (ya no existe fecha_fin_real a nivel vivienda).
  const valoresEfectivos = Object.assign({}, registro, {
    fecha_fin_estimada: maxFechaViviendaCompleta_(viviendasPromo, 'fecha_fin_estimada'),
    fecha_fin_real: maxFechaViviendaCompleta_(viviendasPromo, 'fecha_cfo')
  });

  return '' +
    '<div class="promo-box" data-nivel="promocion">' +
      '<div class="promo-box-head">' +
        '<div class="promo-name">' + escapeHtml(PROMOCIONES_FIJAS[CURRENT_PROMO] || CURRENT_PROMO) + '</div>' +
        '<div class="promo-counts"><b>' + nVillas + '</b> villas · <b>' + nApts + '</b> apartamentos</div>' +
      '</div>' +
      '<div class="promo-box-body">' +
        renderFieldRow(FIELDS_PROMOCION, valoresEfectivos, puedeEditar) +
      '</div>' +
    '</div>';
}

function guardarPromocion(campos) {
  return llamarGuardar({ accion: 'guardar_promocion', usuario: USER_LOGIN, promocion: CURRENT_PROMO, campos: campos })
    .then(() => {
      let registro = DATA_PROMOCIONES.find(r => r.promocion === CURRENT_PROMO);
      if (!registro) { registro = { promocion: CURRENT_PROMO }; DATA_PROMOCIONES.push(registro); }
      Object.assign(registro, campos);
    });
}

// ── BLOQUE 2: tabla de fase, TRANSPUESTA (campo en filas, Villas/Apartamentos
// en columnas) — así caben las 8 fechas sin scroll lateral, sea cual sea el
// ancho de pantalla.
function renderBloque2_Fases() {
  const puedeEditar = puedeEditarNivel('fase');
  const registros = {};
  FASES_FIJAS.forEach(fase => {
    const base = DATA_FASES.find(r => r.promocion === CURRENT_PROMO && r.fase === fase) || { promocion: CURRENT_PROMO, fase: fase };
    const viviendasFase = DATA_VIVIENDAS.filter(r => r.promocion === CURRENT_PROMO && r.fase === fase);
    // fecha_entrega de fase es calculada: la más tardía de sus viviendas.
    registros[fase] = Object.assign({}, base, { fecha_entrega: maxFechaViviendaCompleta_(viviendasFase, 'fecha_entrega') });
  });

  let html = '<div class="fase-table-wrap"><table class="data-table"><thead><tr><th>Campo</th>';
  FASES_FIJAS.forEach(fase => { html += '<th>' + escapeHtml(fase) + '</th>'; });
  html += '</tr></thead><tbody>';

  FIELDS_FASE.forEach(f => {
    html += '<tr><td class="rowlabel">' + etiquetaCampo(f) + '</td>';
    FASES_FIJAS.forEach(fase => {
      html += '<td>' + renderCampoCelda(f, registros[fase][f.key], puedeEditar, f.key, { fase: fase }) + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function guardarFase(fase, campos) {
  return llamarGuardar({ accion: 'guardar_fase', usuario: USER_LOGIN, promocion: CURRENT_PROMO, fase: fase, campos: campos })
    .then(() => {
      let registro = DATA_FASES.find(r => r.promocion === CURRENT_PROMO && r.fase === fase);
      if (!registro) { registro = { promocion: CURRENT_PROMO, fase: fase }; DATA_FASES.push(registro); }
      Object.assign(registro, campos);
    });
}

// ── BLOQUE 3: viviendas predefinidas, un grupo por fase ─────────
function renderBloque3_Viviendas() {
  let html = '';

  FASES_FIJAS.forEach(fase => {
    const viviendas = DATA_VIVIENDAS
      .filter(r => r.promocion === CURRENT_PROMO && r.fase === fase)
      .sort((a, b) => String(a.vivienda).localeCompare(String(b.vivienda), 'es', { numeric: true }));

    html += '<div class="viviendas-group">';
    html += '<div class="viviendas-group-title">' + escapeHtml(fase) + '</div>';
    html += '<div class="viviendas-table-wrap"><table class="data-table"><thead><tr><th>Vivienda</th>';
    FIELDS_VIVIENDA.forEach(f => { html += '<th>' + escapeHtml(f.label) + '</th>'; });
    html += '</tr></thead><tbody>';

    if (!viviendas.length) {
      html += '<tr><td colspan="' + (FIELDS_VIVIENDA.length + 1) + '" style="color:var(--slate-gray); font-style:italic; padding:16px 12px;">Sin sembrar todavía — ejecuta seedViviendas() en el Apps Script.</td></tr>';
    } else {
      viviendas.forEach(v => {
        html += '<tr data-nivel="vivienda" data-fase="' + escapeAttr(fase) + '" data-vivienda="' + escapeAttr(v.vivienda) + '"><td class="vcode">' + escapeHtml(v.vivienda) + '</td>';
        FIELDS_VIVIENDA.forEach(f => {
          const puedeEditarCampo = puedeEditarNivel(f.nivelPermiso || 'vivienda');
          html += '<td>' + renderCampoCelda(f, v[f.key], puedeEditarCampo, f.key, { fase: fase, vivienda: v.vivienda }) + '</td>';
        });
        html += '</tr>';
      });
    }
    html += '</tbody></table></div></div>';
  });

  return html;
}

function guardarVivienda(fase, codigoVivienda, campos) {
  return llamarGuardar({ accion: 'guardar_vivienda', usuario: USER_LOGIN, promocion: CURRENT_PROMO, fase: fase, vivienda: codigoVivienda, campos: campos })
    .then(() => {
      let registro = DATA_VIVIENDAS.find(r => r.promocion === CURRENT_PROMO && r.fase === fase && r.vivienda === codigoVivienda);
      if (registro) Object.assign(registro, campos);
      // fecha_entrega/fecha_fin_estimada/fecha_fin_real de vivienda alimentan
      // campos calculados en Fase y Promoción — se repintan al momento en vez
      // de esperar a un refresco manual.
      renderContenido();
    });
}

// ─── RENDER DE CAMPOS ────────────────────────────────────────────
function etiquetaCampo(f) {
  return f.label + (f.computed ? ' <span style="font-style:italic; text-transform:none; letter-spacing:0;">· calculado</span>' : '');
}
function renderFieldRow(fields, registro, puedeEditar) {
  let html = '<div class="field-row">';
  fields.forEach(f => {
    html += '<div class="field-item"><label class="field-label">' + etiquetaCampo(f) + '</label>';
    html += renderCampoCelda(f, registro[f.key], puedeEditar, f.key, {});
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function formatearValorMostrado(field, valor) {
  if (field.type === 'month') return formatearMesES(valor);
  if (field.type === 'date') return formatearFechaES(valor);
  return valor;
}
function formatearFechaES(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return iso || '';
  const [y, m, d] = String(iso).split('-');
  return d + '/' + m + '/' + y;
}
function formatearMesES(iso) {
  if (!iso) return '';
  const m6 = /^(\d{4})-(\d{2})/.exec(String(iso));
  if (!m6) return iso;
  return m6[2] + '/' + m6[1];
}
// Acepta 'YYYY-MM-DD' (date) o 'YYYY-MM' (month); para 'month' se compara
// contra el día 1 de ese mes — aproximación razonable ya que no hay día exacto.
function parseFechaValor_(iso) {
  if (!iso) return null;
  const s = String(iso);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T00:00:00');
  if (/^\d{4}-\d{2}$/.test(s)) return new Date(s + '-01T00:00:00');
  return null;
}
// Verde: a más de 1 mes vista · Naranja: dentro del mes que viene · Rojo: fecha ya pasada.
// Sin valor → sin color. fecha_licencia y fecha_inicio tampoco llevan color:
// son el arranque de un plazo, no una fecha límite que pueda "vencer".
const CAMPOS_SIN_SEMAFORO = ['fecha_licencia', 'fecha_inicio', 'fecha_cfo'];
function claseSemaforo(iso, campoKey) {
  if (CAMPOS_SIN_SEMAFORO.indexOf(campoKey) !== -1) return '';
  const fecha = parseFechaValor_(iso);
  if (!fecha) return '';
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const diffDias = Math.round((fecha - hoy) / 86400000);
  if (diffDias < 0) return 'due-red';
  if (diffDias <= 30) return 'due-orange';
  return 'due-green';
}
function renderCampoCelda(field, valor, puedeEditar, campoKey, ctx) {
  const clase = (field.type === 'date' || field.type === 'month') ? claseSemaforo(valor, campoKey) : '';
  const editable = puedeEditar && !field.computed;
  if (!editable) {
    const vacio = (valor === undefined || valor === null || valor === '');
    const texto = vacio ? (field.computed ? 'Sin viviendas con fecha' : 'Sin definir') : escapeHtml(formatearValorMostrado(field, valor));
    return '<div class="field-value' + (vacio ? ' empty' : '') + (clase ? ' ' + clase : '') + '">' + texto + '</div>';
  }
  const valorAttr = (valor === undefined || valor === null) ? '' : escapeAttr(valor);
  const ctxAttrs = 'data-campo="' + campoKey + '"' +
    (ctx.fase ? ' data-fase="' + escapeAttr(ctx.fase) + '"' : '') +
    (ctx.vivienda ? ' data-vivienda="' + escapeAttr(ctx.vivienda) + '"' : '');
  return '<input class="field-input' + (clase ? ' ' + clase : '') + '" type="' + field.type + '" value="' + valorAttr + '" ' + ctxAttrs + '>';
}

// ─── LISTENERS (delegación: un solo listener por elemento generado) ────
function activarListeners() {
  const cont = document.getElementById('content');

  cont.querySelectorAll('.promo-box[data-nivel="promocion"] .promo-box-body input[data-campo]').forEach(el => {
    el.addEventListener((el.type === 'date' || el.type === 'month') ? 'change' : 'blur', () => guardarCampoInput(el, campos => guardarPromocion(campos)));
  });

  cont.querySelectorAll('.fase-table-wrap input[data-campo]').forEach(el => {
    const fase = el.dataset.fase;
    el.addEventListener((el.type === 'date' || el.type === 'month') ? 'change' : 'blur', () => guardarCampoInput(el, campos => guardarFase(fase, campos)));
  });

  cont.querySelectorAll('tr[data-nivel="vivienda"] input[data-campo]').forEach(el => {
    const fila = el.closest('tr');
    const fase = fila.dataset.fase;
    const vivienda = fila.dataset.vivienda;
    el.addEventListener((el.type === 'date' || el.type === 'month') ? 'change' : 'blur', () => guardarCampoInput(el, campos => guardarVivienda(fase, vivienda, campos)));
  });
}

function guardarCampoInput(el, onSave) {
  const campo = el.dataset.campo;
  const nuevoValor = el.value;
  el.classList.add('saving');
  el.classList.remove('err-flash', 'saved-flash');
  const campos = {}; campos[campo] = nuevoValor;
  onSave(campos)
    .then(() => {
      el.classList.remove('saving');
      el.classList.remove('due-green', 'due-orange', 'due-red');
      const clase = claseSemaforo(nuevoValor, campo);
      if (clase) el.classList.add(clase);
      el.classList.add('saved-flash');
      setTimeout(() => el.classList.remove('saved-flash'), 1200);
    })
    .catch(e => {
      console.error('Error al guardar ' + campo + ':', e);
      el.classList.remove('saving');
      el.classList.add('err-flash');
      setTimeout(() => el.classList.remove('err-flash'), 2500);
    });
}

// ─── LLAMADA GENÉRICA DE GUARDADO ────────────────────────────────
function llamarGuardar(payload) {
  return fetch(FECHAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!data || data.ok !== true) throw new Error((data && data.motivo) || 'respuesta sin ok:true');
      return data;
    });
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
