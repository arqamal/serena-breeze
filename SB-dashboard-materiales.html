<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serena Breeze — Dashboard de Materiales</title>
<meta name="theme-color" content="#1A1A1A">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF;
    --off-white: #F7F6F4;
    --border: #E0DDD8;
    --mid: #B0AA9F;
    --slate-gray: #6B7280;
    --text: #2A2520;
    --black: #111111;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Roboto', sans-serif; background: var(--white); color: var(--text); font-size: 14px; }

  main { max-width: 1080px; margin: 0 auto; padding: 40px 48px 80px; }
  .sec-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); margin-bottom: 10px; }
  .sec-title { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 400; text-transform: uppercase; color: var(--black); margin-bottom: 12px; letter-spacing: 1px; }
  .sec-desc { font-size: 14px; font-weight: 300; color: var(--slate-gray); line-height: 1.7; max-width: 640px; margin-bottom: 28px; }

  /* TOP BAR */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--border); }
  .seg button { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 22px; cursor: pointer; background: var(--white); color: var(--slate-gray); border: none; border-right: 1px solid var(--border); transition: all .15s; }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--black); color: white; }
  .seg button:hover:not(.active) { background: var(--off-white); color: var(--text); }
  .seg.small button { padding: 9px 14px; font-size: 11px; letter-spacing: 1.5px; }

  .search-input, .filter-select { border: 1px solid var(--border); padding: 11px 14px; font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--text); background: var(--white); outline: none; border-radius: 0; }
  /* Fila de filtros: todo en una línea; los desplegables se reparten el
     espacio que queda y recortan el texto si no cabe. */
  .topbar.filtros { flex-wrap: nowrap; gap: 8px; align-items: stretch; }
  .topbar.filtros > * { height: 40px; padding-top: 0; padding-bottom: 0; }
  .search-input { width: 84px; flex: 0 0 84px; padding-left: 10px; padding-right: 8px; }
  .filter-select { flex: 1 1 0; min-width: 0; padding-left: 10px; padding-right: 6px; text-overflow: ellipsis; }
  .btn-todo { flex: 0 0 auto; white-space: nowrap; padding: 11px 12px; letter-spacing: 1.5px; }
  .search-input:focus, .filter-select:focus { border-color: var(--black); }

  .btn { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; padding: 11px 18px; background: transparent; color: var(--slate-gray); border: 1px solid var(--border); transition: all .15s; }
  .btn:hover { border-color: var(--black); color: var(--black); }
  .btn-group { display: flex; border: 1px solid var(--border); margin-left: auto; }
  .btn-group .btn { border: none; border-right: 1px solid var(--border); }
  .btn-group .btn:last-child { border-right: none; }

  #generado { display: block; font-size: 11px; color: var(--mid); margin-bottom: 12px; }
  #generado:empty { display: none; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); margin-bottom: 20px; }
  .kpi { padding: 16px 20px; border-right: 1px solid var(--border); cursor: pointer; transition: background .15s; position: relative; }
  .kpi:hover { background: var(--off-white); }
  .kpi.active { background: var(--off-white); box-shadow: inset 0 -3px 0 var(--black); }
  .kpi:last-child { border-right: none; }
  .kpi-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--slate-gray); margin-bottom: 6px; }
  .kpi-value { font-family: 'Oswald', sans-serif; font-size: 26px; color: var(--black); }
  .kpi-sub { font-size: 11px; color: var(--mid); margin-top: 2px; }
  .progress { height: 3px; background: var(--border); margin-top: 8px; }
  .progress > div { height: 100%; background: var(--black); }

  #load-indicator { display: none; font-size: 12px; color: var(--slate-gray); padding: 8px 16px; background: var(--off-white); border: 1px solid var(--border); margin-bottom: 20px; }
  #load-indicator.err { color: #c0392b; background: #fdf0ee; border-color: #f0c4bc; }
  #demo-banner { display: none; font-size: 12px; color: #8a5a00; padding: 8px 16px; background: #fff8e6; border: 1px solid #f0dca8; margin-bottom: 20px; }
  #empty-state { display: none; font-size: 14px; color: var(--slate-gray); padding: 32px; text-align: center; border: 1px solid var(--border); }

  /* VIVIENDA CARD */
  .vivienda-card { border: 1px solid var(--border); margin-bottom: 16px; }
  .vivienda-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: var(--off-white); border-bottom: 1px solid var(--border); cursor: pointer; }
  .vivienda-card.collapsed .vivienda-head { border-bottom: none; }
  .vh-left { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .vivienda-code { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--black); }
  .vivienda-cliente { font-size: 12px; color: var(--slate-gray); }
  .vivienda-meta { display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate-gray); background: var(--white); border: 1px solid var(--border); padding: 3px 9px; border-radius: 2px; white-space: nowrap; }
  .pdf-btn { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--slate-gray); background: var(--white); border: 1px solid var(--border); padding: 3px 10px; border-radius: 2px; cursor: pointer; }
  .pdf-btn:hover { border-color: var(--black); color: var(--black); }
  .caret { font-size: 11px; color: var(--mid); transition: transform .15s; }
  .vivienda-card.collapsed .caret { transform: rotate(-90deg); }
  .vivienda-body { padding: 4px 20px 18px; }
  .vivienda-card.collapsed .vivienda-body { display: none; }

  .status-chip { display: inline-block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; white-space: nowrap; }
  .chip-ok { background: #f0faf0; color: #2d7a2d; border: 1px solid #b8ddb8; }
  .chip-pend { background: #FEF3EA; color: #E87722; border: 1px solid #F5C89A; }
  .chip-parcial { background: #EEF3FB; color: #2F5C9E; border: 1px solid #BFD0EA; }

  .block-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); margin: 18px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .mat-grid { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 32px; }
  .mat-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .mat-label { color: var(--slate-gray); }
  .mat-value { color: var(--text); text-align: right; font-weight: 400; }
  .mat-value.vacio { color: var(--mid); font-style: italic; }
  .mat-value.hl { background: #FFF3B0; padding: 0 4px; }
  .obs { font-size: 13px; color: var(--text); background: var(--off-white); border: 1px solid var(--border); padding: 10px 12px; line-height: 1.6; }
  .obs-tr { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); color: var(--slate-gray); font-style: italic; }
  .obs-tr span { display: block; font-style: normal; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid); margin-bottom: 3px; }
  .ficha { display: flex; gap: 24px; flex-wrap: wrap; font-size: 12px; color: var(--slate-gray); margin-top: 14px; }
  .ficha b { color: var(--text); font-weight: 400; }

  /* POR ELEMENTO / POR MATERIAL */
  .grp-row { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(80px, 180px); gap: 16px; align-items: center; padding: 9px 0 3px; font-size: 13px; }
  .grp-name { color: var(--text); }
  .grp-name.dim { color: var(--mid); }
  .grp-count { font-family: 'Oswald', sans-serif; font-size: 16px; text-align: right; }
  .grp-count.dim { color: var(--mid); }
  .grp-bar { height: 6px; background: var(--border); }
  .grp-bar > div { height: 100%; background: var(--black); }
  .grp-viv { font-size: 11px; color: var(--slate-gray); padding: 0 0 9px; border-bottom: 1px solid var(--border); line-height: 1.6; letter-spacing: .3px; }
  .grp-block:last-child .grp-viv { border-bottom: none; }
  .hl-text { background: #FFF3B0; padding: 0 3px; }

  /* LOGIN */
  #login-screen { position: fixed; inset: 0; background: var(--white); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { width: 100%; max-width: 380px; padding: 48px 40px; border: 1px solid var(--border); }
  .login-logo { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--black); margin-bottom: 6px; }
  .login-sub { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mid); margin-bottom: 40px; }
  .login-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .login-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate-gray); }
  .login-input { border: 1px solid var(--border); padding: 12px 14px; font-size: 14px; color: var(--text); outline: none; border-radius: 0; width: 100%; }
  .login-input:focus { border-color: var(--black); }
  .login-btn { width: 100%; margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; background: var(--black); color: white; border: none; padding: 14px; cursor: pointer; }
  .login-btn:disabled { opacity: .55; cursor: default; }
  .login-error { font-size: 12px; color: #c0392b; margin-top: 14px; text-align: center; display: none; }
  .login-demo { display: block; margin-top: 18px; text-align: center; font-size: 11px; letter-spacing: 1px; color: var(--mid); cursor: pointer; text-decoration: underline; background: none; border: none; width: 100%; }

  #app-wrapper { display: none; }

  @media (max-width: 768px) {
    main { padding: 24px 16px 60px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi:nth-child(2) { border-right: none; }
    .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
    .mat-grid { grid-template-columns: 1fr; }
    .btn-group { margin-left: 0; }
    .topbar.filtros { flex-wrap: wrap; }
    .search-input { flex: 1 1 100%; width: auto; }
    .filter-select { flex: 1 1 45%; }
    .btn-todo { flex: 1 1 100%; }
    .grp-row { grid-template-columns: minmax(0, 1fr) 36px 70px; gap: 10px; }
    .vivienda-head { flex-wrap: wrap; padding: 12px 14px; }
    .vivienda-meta { flex-wrap: wrap; }
    .vivienda-body { padding: 4px 14px 14px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Serena Breeze</div>
    <div class="login-sub">Dashboard de materiales · Uso interno</div>
    <div class="login-field">
      <label class="login-label">Usuario</label>
      <input class="login-input" id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    </div>
    <div class="login-field">
      <label class="login-label">Contraseña</label>
      <input class="login-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Acceder →</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
    <button class="login-demo" id="login-demo" onclick="entrarDemo()">Ver con datos de ejemplo</button>
  </div>
</div>

<div id="app-wrapper">
  <main>
    <div class="sec-eyebrow">Serena Breeze · Aftersale</div>
    <div class="sec-title">Materiales</div>
    <div class="sec-desc">Elección de acabados de cada vivienda. Vista por vivienda, elemento y material.</div>

    <div class="topbar">
      <div class="seg">
        <button id="tab-2SB" onclick="switchPromo('2SB')">2SB</button>
        <button id="tab-3SB" onclick="switchPromo('3SB')">3SB</button>
      </div>
      <div class="seg small">
        <button id="vista-viviendas" class="active" onclick="setVista('viviendas')">Por vivienda</button>
        <button id="vista-elementos" onclick="setVista('elementos')">Por elemento</button>
        <button id="vista-materiales" onclick="setVista('materiales')">Por material</button>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="if (CURRENT_PROMO) loadPromo(CURRENT_PROMO, true)">↻ Actualizar</button>
        <button class="btn" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>

    <div class="topbar filtros">
      <input class="search-input" id="search-input" type="text" placeholder="Vivienda…" title="Buscar vivienda" oninput="render()">
      <select class="filter-select" id="f-tipo" onchange="onTipoChange()">
        <option value="">Villas y apartamentos</option>
        <option value="villa">Solo villas</option>
        <option value="apartamento">Solo apartamentos</option>
      </select>
      <select class="filter-select" id="f-estado" onchange="render()">
        <option value="">Todos los estados</option>
        <option value="completa">Completas</option>
        <option value="parcial">Incompletas</option>
        <option value="pendiente">Sin elección</option>
      </select>
      <select class="filter-select" id="f-campo" onchange="onCampoChange()">
        <option value="">Cualquier elemento</option>
      </select>
      <select class="filter-select" id="f-mat" onchange="render()">
        <option value="">Cualquier material</option>
      </select>
      <button class="btn btn-todo" id="toggle-todo-btn" onclick="toggleTodo()">▴ Contraer todo</button>
    </div>


    <div id="aviso-traduccion" style="display:none;font-size:12px;color:#c0392b;padding:8px 16px;background:#fdf0ee;border:1px solid #f0c4bc;margin-bottom:20px"></div>
    <div id="demo-banner">Modo ejemplo — datos inventados. Nada de lo que ves aquí sale de la Sheet real.</div>
    <div id="load-indicator"></div>
    <div id="kpis" class="kpis" style="display:none"></div>
    <span id="generado"></span>
    <div id="empty-state"></div>
    <div id="cards-container"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// ─── LOGIN (AuthUsuarios.gs — login centralizado) ───────────────────
const LOGIN_URL = 'https://script.google.com/macros/s/AKfycbzC9AI5br9PbD6cwCN0ombsIE7HYdIK7Uz3QoGiSZ_QHVhz8FsGJLvfJfkU51DBbL4H/exec';
const CLAVE_TOKEN_SESION = 'amal_token';
// Permiso propio: columna acceso_dashboard_materiales en _usuarios.
const HERRAMIENTA = 'dashboard-materiales';

// ─── BACKEND (GeneradorDashboardMateriales.gs — solo lectura) ───────
//   POST { accion:'consultar', promocion:'2SB'|'3SB', token, forzar? }
//   → { ok, generado, campos:{villa:[{key,header}], apartamento:[...]},
//       viviendas:[{ vivienda, tipo, fecha, comentarios, num_registros, materiales:{} }] }
// Pegar aquí la URL /exec tras implementar el script como aplicación web.
const BACKEND_MATERIALES = 'https://script.google.com/macros/s/AKfycbzdx_NdeUaG8Ne_EA-vmbMMg7yO9OnIQDdaJJp56G0zIBlLgygjJHRElWAugiYSB9GxkA/exec';

// ─── CAMPOS ─────────────────────────────────────────────────────────
// Las columnas reales llegan del backend (leídas de la cabecera de la Sheet).
// Estas son solo el respaldo y el modo ejemplo, con las mismas claves.
const LABELS = {
  pav_int: 'Pavimento interior', pav_ext: 'Pavimento exterior',
  alic_bano1: 'Alicatado baño 1', alic_bano2: 'Alicatado baño 2', alic_tv: 'Alicatado zona TV',
  mueble_bano1: 'Mueble baño 1', lavabo_bano1: 'Lavabo baño 1',
  mueble_bano2: 'Mueble baño 2', lavabo_bano2: 'Lavabo baño 2',
  cocina_interior: 'Cocina · interior', cocina_zona_a: 'Cocina · zona A (frentes armario)',
  cocina_zona_b: 'Cocina · zona B (trasera y vinoteca)', cocina_encimera: 'Cocina · encimera',
  piscina: 'Piscina'
};
let CAMPOS = {
  villa: ['pav_int','pav_ext','alic_bano1','alic_bano2','alic_tv','mueble_bano1','lavabo_bano1','mueble_bano2','lavabo_bano2','cocina_interior','cocina_zona_a','cocina_zona_b','cocina_encimera','piscina'],
  apartamento: ['pav_int','alic_bano1','alic_bano2','lavabo_bano1','lavabo_bano2','cocina_interior','cocina_zona_a','cocina_zona_b','cocina_encimera']
};
function camposDe(tipo) { return (tipo === 'villa' ? CAMPOS.villa : CAMPOS.apartamento).map(k => [k, labelCampo(k)]); }
function camposUnion() {
  const keys = CAMPOS.villa.concat(CAMPOS.apartamento.filter(k => !CAMPOS.villa.includes(k)));
  return keys.map(k => [k, labelCampo(k)]);
}
let LABELS_SHEET = {};
function labelCampo(key) {
  if (LABELS[key]) return LABELS[key];
  const h = LABELS_SHEET[key] || key;
  return h.charAt(0).toUpperCase() + h.slice(1).toLowerCase();
}
function aplicarCamposBackend(c) {
  if (!c) return;
  if (c.villa && c.villa.length) CAMPOS.villa = c.villa.map(x => x.key);
  if (c.apartamento && c.apartamento.length) CAMPOS.apartamento = c.apartamento.map(x => x.key);
  (c.villa || []).concat(c.apartamento || []).forEach(x => LABELS_SHEET[x.key] = x.header);
}

// ─── ESTADO ─────────────────────────────────────────────────────────
let CURRENT_PROMO = null;
let VISTA = 'viviendas';
let DATA = [];
let DEMO = false;
const COLLAPSED = {};

// ─── LOGIN ──────────────────────────────────────────────────────────
function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Comprobando…';
  fetch(LOGIN_URL, { method: 'POST', body: JSON.stringify({ accion: 'login', usuario: u, pass: p, herramienta: HERRAMIENTA }) })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        if (data.token) localStorage.setItem(CLAVE_TOKEN_SESION, data.token);
        entrarApp();
      } else {
        errorEl.textContent = data.motivo === 'sin_acceso' ? 'Tu usuario no tiene acceso al dashboard de materiales.' : 'Usuario o contraseña incorrectos';
        errorEl.style.display = 'block';
      }
    })
    .catch(() => { errorEl.textContent = 'No se pudo comprobar el acceso. Inténtalo de nuevo.'; errorEl.style.display = 'block'; })
    .finally(() => { btn.disabled = false; btn.textContent = 'Acceder →'; });
}
function intentarSesionGuardada() {
  const token = localStorage.getItem(CLAVE_TOKEN_SESION);
  if (!token) return Promise.resolve(false);
  return fetch(LOGIN_URL, { method: 'POST', body: JSON.stringify({ accion: 'login', token, herramienta: HERRAMIENTA }) })
    .then(r => r.json())
    .then(data => {
      if (!data.ok) { localStorage.removeItem(CLAVE_TOKEN_SESION); return false; }
      if (data.token) localStorage.setItem(CLAVE_TOKEN_SESION, data.token);
      return true;
    })
    .catch(() => false);
}
function entrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrapper').style.display = 'block';
  mostrarVacio('Elige Serena Breeze 2 o Serena Breeze 3 arriba para cargar sus materiales.');
}
function entrarDemo() {
  DEMO = true;
  document.getElementById('demo-banner').style.display = 'block';
  entrarApp();
}
function cerrarSesion() { localStorage.removeItem(CLAVE_TOKEN_SESION); location.reload(); }

document.addEventListener('DOMContentLoaded', () => {
  ['login-user','login-pass'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
  intentarSesionGuardada().then(ok => { if (ok) entrarApp(); });
});

// ─── CARGA ──────────────────────────────────────────────────────────
function switchPromo(promo) {
  CURRENT_PROMO = promo;
  ['2SB','3SB'].forEach(p => document.getElementById('tab-' + p).classList.toggle('active', p === promo));
  loadPromo(promo);
}
function loadPromo(promo, forzar) {
  const ind = document.getElementById('load-indicator');
  document.getElementById('cards-container').innerHTML = '';
  document.getElementById('empty-state').style.display = 'none';
  ind.className = ''; ind.style.display = 'block';
  ind.textContent = 'Cargando materiales de ' + promo + '…';

  if (DEMO) {
    setTimeout(() => { DATA = generarDemo(promo); ind.style.display = 'none'; poblarFiltroCampos(); render(); }, 250);
    return;
  }
  if (BACKEND_MATERIALES.startsWith('PENDIENTE')) {
    ind.className = 'err';
    ind.textContent = 'Falta la URL del backend (BACKEND_MATERIALES). Mientras tanto, usa "Ver con datos de ejemplo" en la pantalla de acceso.';
    return;
  }
  fetch(BACKEND_MATERIALES, {
    method: 'POST',
    body: JSON.stringify({ accion: 'consultar', promocion: promo, forzar: !!forzar, token: localStorage.getItem(CLAVE_TOKEN_SESION) || '' })
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!data.ok && (data.motivo === 'sin_sesion' || data.motivo === 'sin_acceso')) {
        localStorage.removeItem(CLAVE_TOKEN_SESION);
        alert(data.motivo === 'sin_acceso' ? 'Tu usuario ya no tiene acceso a este dashboard.' : 'La sesión ha caducado. Vuelve a entrar.');
        location.reload();
        return;
      }
      if (!data.ok) throw new Error(data.error || data.motivo || 'respuesta sin ok:true');
      aplicarCamposBackend(data.campos);
      DATA = (data.viviendas || []).filter(v => v.vivienda);
      document.getElementById('generado').textContent = data.generado ? 'Datos leídos de la Sheet: ' + data.generado : '';
      const avisoTr = document.getElementById('aviso-traduccion');
      avisoTr.textContent = data.traduccion_error ? 'No se han podido traducir los comentarios: ' + data.traduccion_error : '';
      avisoTr.style.display = data.traduccion_error ? 'block' : 'none';
      ind.style.display = 'none';
      poblarFiltroCampos();
      render();
    })
    .catch(e => { ind.className = 'err'; ind.textContent = 'Error al cargar los datos: ' + e.message; });
}

// ─── LÓGICA ─────────────────────────────────────────────────────────
function valorDe(v, k) { return String((v.materiales || {})[k] || '').trim(); }
function estadoVivienda(v) {
  const campos = camposDe(v.tipo);
  const llenos = campos.filter(([k]) => valorDe(v, k)).length;
  if (llenos === 0) return 'pendiente';
  if (llenos < campos.length) return 'parcial';
  return 'completa';
}
function chipEstado(est, v) {
  if (est === 'completa') return '<span class="status-chip chip-ok">Completa</span>';
  if (est === 'pendiente') return '<span class="status-chip chip-pend">Sin elección</span>';
  const campos = camposDe(v.tipo);
  const llenos = campos.filter(([k]) => valorDe(v, k)).length;
  return `<span class="status-chip chip-parcial">${llenos}/${campos.length}</span>`;
}
function tieneCampo(v, k) { return (v.tipo === 'villa' ? CAMPOS.villa : CAMPOS.apartamento).includes(k); }

// Filtros comunes a las 3 vistas. ignorarEstado: para contar la cinta de
// KPIs sin que el propio filtro de estado deje las demás casillas a 0.
function filtros() {
  return {
    q: (document.getElementById('search-input').value || '').trim().toUpperCase(),
    tipo: document.getElementById('f-tipo').value,
    est: document.getElementById('f-estado').value,
    campo: document.getElementById('f-campo').value,
    mat: document.getElementById('f-mat').value
  };
}
function filtrar(ignorarEstado) {
  const f = filtros();
  return DATA.filter(v => {
    if (f.tipo && v.tipo !== f.tipo) return false;
    if (!ignorarEstado && f.est && estadoVivienda(v) !== f.est) return false;
    if (f.q && !String(v.vivienda).toUpperCase().includes(f.q)) return false;
    if (f.campo && !tieneCampo(v, f.campo)) return false;
    if (f.mat) {
      const keys = f.campo ? [f.campo] : camposDe(v.tipo).map(c => c[0]);
      if (!keys.some(k => valorDe(v, k) === f.mat)) return false;
    }
    return true;
  }).sort((a, b) => compareViviendas(a.vivienda, b.vivienda));
}

function onTipoChange() { poblarFiltroCampos(); render(); }
function poblarFiltroCampos() {
  const sel = document.getElementById('f-campo');
  const actual = sel.value;
  const tipo = document.getElementById('f-tipo').value;
  const campos = tipo ? camposDe(tipo) : camposUnion();
  sel.innerHTML = '<option value="">Cualquier elemento</option>' + campos.map(([k, l]) => `<option value="${k}">${escapeHtml(l)}</option>`).join('');
  if (campos.some(c => c[0] === actual)) sel.value = actual;
  onCampoChange(true);
}
// El desplegable de material solo ofrece los materiales que existen en el
// elemento elegido (o en todos, si no hay elemento elegido).
function onCampoChange(sinRender) {
  const campo = document.getElementById('f-campo').value;
  const tipo = document.getElementById('f-tipo').value;
  const selM = document.getElementById('f-mat');
  const actual = selM.value;
  const set = new Set();
  DATA.forEach(v => {
    if (tipo && v.tipo !== tipo) return;
    const keys = campo ? [campo] : camposDe(v.tipo).map(c => c[0]);
    keys.forEach(k => { const x = valorDe(v, k); if (x) set.add(x); });
  });
  const valores = [...set].sort((a, b) => a.localeCompare(b, 'es'));
  selM.innerHTML = '<option value="">Cualquier material</option>' + valores.map(x => `<option value="${escapeAttr(x)}">${escapeHtml(x)}</option>`).join('');
  if (valores.includes(actual)) selM.value = actual;
  if (sinRender !== true) render();
}

function setVista(v) {
  VISTA = v;
  ['viviendas', 'elementos', 'materiales'].forEach(x => document.getElementById('vista-' + x).classList.toggle('active', x === v));
  render();
}
function filtrarEstadoKpi(est) {
  const sel = document.getElementById('f-estado');
  sel.value = sel.value === est ? '' : est; // pulsar la casilla activa la quita
  render();
}

// ─── RENDER ─────────────────────────────────────────────────────────
let CLAVES_VISTA = []; // claves de las tarjetas pintadas (para contraer/desplegar todo)

function render() {
  if (!CURRENT_PROMO) return;
  const lista = filtrar();
  const kpis = document.getElementById('kpis');
  if (VISTA === 'viviendas') renderKpis(filtrar(true)); else kpis.style.display = 'none';

  let tarjetas = [];
  if (lista.length) {
    if (VISTA === 'elementos') tarjetas = tarjetasElementos(lista);
    else if (VISTA === 'materiales') tarjetas = tarjetasMateriales(lista);
    else tarjetas = tarjetasViviendas(lista);
  }
  CLAVES_VISTA = tarjetas.map(t => t.key);
  const cont = document.getElementById('cards-container');
  if (!tarjetas.length) {
    cont.innerHTML = '';
    mostrarVacio(DATA.length ? 'Nada coincide con el filtro.' : 'No hay viviendas para esta promoción.');
  } else {
    document.getElementById('empty-state').style.display = 'none';
    cont.innerHTML = tarjetas.map(cardHtml).join('');
  }
  actualizarBotonTodo();
}

function renderKpis(lista) {
  const el = document.getElementById('kpis');
  const est = document.getElementById('f-estado').value;
  const n = lista.length;
  const c = { completa: 0, parcial: 0, pendiente: 0 };
  lista.forEach(v => c[estadoVivienda(v)]++);
  const pct = n ? Math.round(c.completa / n * 100) : 0;
  const act = x => (est === x ? ' active' : '');
  el.innerHTML = `
    <div class="kpi${act('')}" onclick="filtrarEstadoKpi('')" title="Mostrar todas"><div class="kpi-label">Viviendas</div><div class="kpi-value">${n}</div>
      <div class="kpi-sub">${lista.filter(v => v.tipo === 'villa').length} villas · ${lista.filter(v => v.tipo !== 'villa').length} apts.</div></div>
    <div class="kpi${act('completa')}" onclick="filtrarEstadoKpi('completa')" title="Mostrar solo completas"><div class="kpi-label">Completas</div><div class="kpi-value">${c.completa}</div>
      <div class="progress"><div style="width:${pct}%"></div></div><div class="kpi-sub">${pct}%</div></div>
    <div class="kpi${act('parcial')}" onclick="filtrarEstadoKpi('parcial')" title="Mostrar solo incompletas"><div class="kpi-label">Incompletas</div><div class="kpi-value">${c.parcial}</div><div class="kpi-sub">faltan campos</div></div>
    <div class="kpi${act('pendiente')}" onclick="filtrarEstadoKpi('pendiente')" title="Mostrar solo sin elección"><div class="kpi-label">Sin elección</div><div class="kpi-value">${c.pendiente}</div><div class="kpi-sub">sin fila en la Sheet</div></div>`;
  el.style.display = 'grid';
}

// Tarjeta común a las 3 vistas: misma cabecera, píldoras, PDF y plegado.
function cardHtml(t) {
  const id = VISTA + ':' + t.key;
  const collapsed = COLLAPSED[id] ? ' collapsed' : '';
  const k = jsStr(t.key);
  return `
    <div class="vivienda-card${collapsed}">
      <div class="vivienda-head" onclick="toggleCard('${k}')">
        <div class="vh-left">
          <span class="vivienda-code">${escapeHtml(t.titulo)}</span>
          ${t.sub ? `<span class="vivienda-cliente">${t.sub}</span>` : ''}
        </div>
        <div class="vivienda-meta">
          ${t.meta || ''}
          ${t.pdf ? `<button class="pdf-btn" onclick="descargarPDF(event, '${k}')">⤓ PDF</button>` : ''}
          <span class="caret">▾</span>
        </div>
      </div>
      <div class="vivienda-body">${t.body}</div>
    </div>`;
}
function hl(txt, on) { return on ? `<span class="hl-text">${escapeHtml(txt)}</span>` : escapeHtml(txt); }

// ── Por vivienda ──
function tarjetasViviendas(lista) {
  const f = filtros();
  return lista.map(v => {
    const est = estadoVivienda(v);
    const filas = camposDe(v.tipo).map(([k, l]) => {
      const val = valorDe(v, k);
      const marcar = val && ((f.campo === k && (!f.mat || f.mat === val)) || (!f.campo && f.mat === val));
      const cls = 'mat-value' + (val ? '' : ' vacio') + (marcar ? ' hl' : '');
      return `<div class="mat-row"><span class="mat-label">${escapeHtml(l)}</span><span class="${cls}">${val ? escapeHtml(val) : '—'}</span></div>`;
    }).join('');
    return {
      key: v.vivienda,
      titulo: v.vivienda,
      sub: v.fecha ? 'Elegido el ' + escapeHtml(v.fecha) : '',
      meta: `<span class="pill">${v.tipo === 'villa' ? 'Villa' : 'Apartamento'}</span>
             ${v.num_registros > 1 ? `<span class="pill" title="Hay ${v.num_registros} filas de esta vivienda en la Sheet; se muestra la más reciente">${v.num_registros} registros</span>` : ''}
             ${chipEstado(est, v)}`,
      pdf: est !== 'pendiente',
      body: est === 'pendiente'
        ? '<div class="block-label">Sin elección registrada</div>'
        : `<div class="block-label">Materiales</div><div class="mat-grid">${filas}</div>
           ${v.comentarios ? `<div class="block-label">Comentarios</div><div class="obs">${escapeHtml(v.comentarios)}${v.comentarios_es ? `<div class="obs-tr"><span>Traducción automática</span>${escapeHtml(v.comentarios_es)}</div>` : ''}</div>` : ''}`
    };
  });
}

// ── Por elemento: una tarjeta por elemento, dentro cada material con sus viviendas ──
function datosElementos(lista) {
  const f = filtros();
  let campos = f.tipo ? camposDe(f.tipo) : camposUnion();
  if (f.campo) campos = campos.filter(c => c[0] === f.campo);
  return campos.map(([k, l]) => {
    const aplicables = lista.filter(v => tieneCampo(v, k));
    const grupos = {}, sinElegir = [];
    aplicables.forEach(v => {
      const val = valorDe(v, k);
      if (!val) { sinElegir.push(v.vivienda); return; }
      (grupos[val] = grupos[val] || []).push(v.vivienda);
    });
    let lista2 = Object.entries(grupos).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'es'));
    if (f.mat) lista2 = lista2.filter(g => g[0] === f.mat);
    return { key: k, label: l, total: aplicables.length, elegidas: aplicables.length - sinElegir.length,
             grupos: lista2, sinElegir: f.mat ? [] : sinElegir };
  }).filter(d => d.total && (d.grupos.length || d.sinElegir.length));
}
function tarjetasElementos(lista) {
  return datosElementos(lista).map(d => {
    const max = Math.max(1, ...d.grupos.map(g => g[1].length));
    const bloques = d.grupos.map(([val, vivs]) => bloqueGrupo(escapeHtml(val), vivs.length, max, vivs)).join('')
      + (d.sinElegir.length ? bloqueGrupo('Sin elegir', d.sinElegir.length, 0, d.sinElegir, true) : '');
    return {
      key: d.key,
      titulo: d.label,
      sub: `${d.grupos.length} opci${d.grupos.length === 1 ? 'ón' : 'ones'}`,
      meta: `<span class="pill">${d.elegidas}/${d.total} elegidas</span>`,
      pdf: true,
      body: `<div class="block-label">Materiales</div>${bloques}`
    };
  });
}

// ── Por material: materiales iguales agrupados, con elemento y viviendas ──
function datosMateriales(lista) {
  const f = filtros();
  const porMat = {};
  lista.forEach(v => {
    camposDe(v.tipo).forEach(([k]) => {
      if (f.campo && k !== f.campo) return;
      const val = valorDe(v, k);
      if (!val || (f.mat && val !== f.mat)) return;
      const m = porMat[val] = porMat[val] || { usos: 0, viviendas: new Set(), elementos: {} };
      m.usos++; m.viviendas.add(v.vivienda);
      (m.elementos[k] = m.elementos[k] || []).push(v.vivienda);
    });
  });
  return Object.keys(porMat).sort((a, b) => a.localeCompare(b, 'es')).map(val => {
    const m = porMat[val];
    const orden = camposUnion().map(c => c[0]);
    const elementos = Object.entries(m.elementos).sort((a, b) => orden.indexOf(a[0]) - orden.indexOf(b[0]));
    return { key: val, usos: m.usos, numViviendas: m.viviendas.size, elementos };
  });
}
function tarjetasMateriales(lista) {
  return datosMateriales(lista).map(d => {
    const max = Math.max(1, ...d.elementos.map(e => e[1].length));
    return {
      key: d.key,
      titulo: d.key,
      sub: `${d.elementos.length} elemento${d.elementos.length === 1 ? '' : 's'}`,
      meta: `<span class="pill">${d.numViviendas} vivienda${d.numViviendas === 1 ? '' : 's'}</span><span class="pill">${d.usos} uso${d.usos === 1 ? '' : 's'}</span>`,
      pdf: true,
      body: `<div class="block-label">Elementos</div>` +
        d.elementos.map(([k, vivs]) => bloqueGrupo(escapeHtml(labelCampo(k)), vivs.length, max, vivs)).join('')
    };
  });
}

function bloqueGrupo(nombreHtml, n, max, vivs, dim) {
  const f = filtros();
  const q = f.q;
  const vivHtml = vivs.map(x => hl(x, q && String(x).toUpperCase().includes(q))).join(' · ');
  return `<div class="grp-block">
    <div class="grp-row">
      <span class="grp-name${dim ? ' dim' : ''}">${nombreHtml}</span>
      <span class="grp-count${dim ? ' dim' : ''}">${n}</span>
      <div class="grp-bar">${dim ? '' : `<div style="width:${n / max * 100}%"></div>`}</div>
    </div>
    <div class="grp-viv">${vivHtml}</div>
  </div>`;
}

function toggleCard(key) { const id = VISTA + ':' + key; COLLAPSED[id] = !COLLAPSED[id]; render(); }
function toggleTodo() {
  const ids = CLAVES_VISTA.map(k => VISTA + ':' + k);
  const todos = ids.length > 0 && ids.every(id => COLLAPSED[id]);
  ids.forEach(id => COLLAPSED[id] = !todos);
  render();
}
function actualizarBotonTodo() {
  const ids = CLAVES_VISTA.map(k => VISTA + ':' + k);
  const todos = ids.length > 0 && ids.every(id => COLLAPSED[id]);
  document.getElementById('toggle-todo-btn').textContent = todos ? '▾ Desplegar todo' : '▴ Contraer todo';
}
function mostrarVacio(txt) {
  const e = document.getElementById('empty-state');
  e.textContent = txt; e.style.display = 'block';
}

// ─── PDF ────────────────────────────────────────────────────────────
function pdfCabecera(titulo, subtitulo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const w = doc.internal.pageSize.getWidth();
  doc.setFillColor(26, 26, 26); doc.rect(0, 0, w, 24, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(titulo.length > 40 ? 13 : 16);
  doc.text(titulo, 14, 12);
  doc.setTextColor(204, 204, 204); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  const promoLabel = CURRENT_PROMO === '2SB' ? 'Serena Breeze 2' : 'Serena Breeze 3';
  doc.text(promoLabel + '  ·  ' + subtitulo + '  ·  Generado el ' + new Date().toLocaleDateString('es-ES'), 14, 19);
  return { doc, w };
}
const PDF_TABLA = {
  theme: 'plain',
  styles: { font: 'helvetica', fontSize: 9, textColor: [42, 37, 32], cellPadding: 2.2 },
  headStyles: { fillColor: [17, 17, 17], textColor: [255, 255, 255], fontStyle: 'bold' },
  alternateRowStyles: { fillColor: [242, 242, 242] }
};
function nombreArchivo(s) { return String(s).replace(/[^\w\-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, ''); }

function descargarPDF(ev, key) {
  ev.stopPropagation();
  if (!window.jspdf) { alert('No se ha podido cargar jsPDF.'); return; }
  if (VISTA === 'elementos') return pdfElemento(key);
  if (VISTA === 'materiales') return pdfMaterial(key);
  return pdfVivienda(key);
}

function pdfVivienda(codigo) {
  const v = DATA.find(x => x.vivienda === codigo);
  if (!v) return;
  const { doc, w } = pdfCabecera('SERENA BREEZE — MATERIALES ' + v.vivienda, v.tipo === 'villa' ? 'Villa' : 'Apartamento');
  doc.autoTable(Object.assign({
    startY: 32,
    head: [['Elemento', 'Material']],
    body: camposDe(v.tipo).map(([k, l]) => [l, valorDe(v, k) || '—']),
    columnStyles: { 0: { cellWidth: 70 } }
  }, PDF_TABLA));
  let y = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(9); doc.setTextColor(51, 51, 51);
  if (v.fecha) { doc.text('Fecha de elección: ' + v.fecha, 14, y); y += 5; }
  if (v.comentarios) {
    y += 3;
    doc.setFillColor(245, 245, 245);
    const lines = doc.splitTextToSize(v.comentarios, w - 32);
    const linesTr = v.comentarios_es ? doc.splitTextToSize(v.comentarios_es, w - 32) : [];
    const alto = lines.length * 4.5 + 9 + (linesTr.length ? linesTr.length * 4.5 + 9 : 0);
    doc.rect(14, y - 4, w - 28, alto, 'F');
    doc.setFont('helvetica', 'bold'); doc.text('COMENTARIOS', 16, y + 1);
    doc.setFont('helvetica', 'normal'); doc.text(lines, 16, y + 6);
    if (linesTr.length) {
      const yTr = y + 6 + lines.length * 4.5 + 4;
      doc.setFont('helvetica', 'bold'); doc.setTextColor(120, 120, 120); doc.text('TRADUCCIÓN AUTOMÁTICA', 16, yTr);
      doc.setFont('helvetica', 'italic'); doc.text(linesTr, 16, yTr + 5);
      doc.setTextColor(51, 51, 51); doc.setFont('helvetica', 'normal');
    }
  }
  doc.save(v.vivienda + '_materiales.pdf');
}

function pdfElemento(key) {
  const d = datosElementos(filtrar()).find(x => x.key === key);
  if (!d) return;
  const { doc } = pdfCabecera('MATERIALES — ' + d.label.toUpperCase(), `${d.elegidas}/${d.total} viviendas con elección`);
  const body = d.grupos.map(([val, vivs]) => [val, vivs.length, vivs.join(', ')]);
  if (d.sinElegir.length) body.push(['Sin elegir', d.sinElegir.length, d.sinElegir.join(', ')]);
  doc.autoTable(Object.assign({
    startY: 32,
    head: [['Material', 'Nº', 'Viviendas']],
    body,
    columnStyles: { 0: { cellWidth: 60 }, 1: { cellWidth: 12, halign: 'center' } }
  }, PDF_TABLA));
  doc.save(CURRENT_PROMO + '_elemento_' + nombreArchivo(d.label) + '.pdf');
}

function pdfMaterial(key) {
  const d = datosMateriales(filtrar()).find(x => x.key === key);
  if (!d) return;
  const { doc } = pdfCabecera('MATERIAL — ' + d.key.toUpperCase(), `${d.numViviendas} viviendas · ${d.usos} usos`);
  doc.autoTable(Object.assign({
    startY: 32,
    head: [['Elemento', 'Nº', 'Viviendas']],
    body: d.elementos.map(([k, vivs]) => [labelCampo(k), vivs.length, vivs.join(', ')]),
    columnStyles: { 0: { cellWidth: 60 }, 1: { cellWidth: 12, halign: 'center' } }
  }, PDF_TABLA));
  doc.save(CURRENT_PROMO + '_material_' + nombreArchivo(d.key) + '.pdf');
}

// ─── UTILIDADES ─────────────────────────────────────────────────────
function compareViviendas(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  if (ka[0] !== kb[0]) return ka[0] - kb[0];
  if (ka[1] !== kb[1]) return ka[1] - kb[1];
  return String(a).localeCompare(String(b));
}
function sortKey(v) {
  const m = String(v).replace(/^(2SB|3SB)/i, '').match(/^(\d+)/);
  if (!m) return [2, 0];
  return [m[1].length >= 3 ? 1 : 0, parseInt(m[1], 10)];
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
function jsStr(s) { return escapeAttr(String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }

  };
  let seed = promo === '2SB' ? 7 : 13;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const cat = promo === '2SB'
    ? { villas: ['2SB1','2SB2','2SB3','2SB4'], apts: ['2SB101','2SB102','2SB103','2SB104','2SB105','2SB111','2SB112','2SB113','2SB114','2SB115','2SB121','2SB122'] }
    : { villas: ['3SB1','3SB2','3SB3','3SB4','3SB5','3SB6','3SB7'], apts: ['3SB101','3SB102','3SB111','3SB112','3SB121','3SB201','3SB202','3SB211','3SB301','3SB311','3SB321'] };
  const mk = (codigo, tipo) => {
    const r = rnd();
    const keys = tipo === 'villa' ? CAMPOS.villa : CAMPOS.apartamento;
    const m = {};
    if (r > 0.25) {
      const cuantos = r > 0.45 ? keys.length : Math.ceil(keys.length / 3);
      keys.slice(0, cuantos).forEach(k => m[k] = pick(O[k] || ['—']));
    }
    const vacio = !Object.keys(m).length;
    const d = 1 + Math.floor(rnd() * 27), mes = 5 + Math.floor(rnd() * 4);
    return {
      vivienda: codigo, tipo,
      fecha: vacio ? '' : String(d).padStart(2, '0') + '/' + String(mes).padStart(2, '0') + '/2026 ' + (9 + Math.floor(rnd() * 9)) + ':' + String(Math.floor(rnd() * 60)).padStart(2, '0'),
      ...(() => {
        if (vacio || rnd() <= 0.55) return { comentarios: '', comentarios_es: '' };
        if (rnd() > 0.5) return { comentarios: 'Like the showhouse appartment', comentarios_es: 'Como el apartamento piloto' };
        return { comentarios: Object.keys(m).length < keys.length ? 'Pendientes los demás materiales' : 'Cocina como el apartamento piloto', comentarios_es: '' };
      })(),
      num_registros: vacio ? 0 : (rnd() > 0.85 ? 2 : 1),
      materiales: m
    };
  };
  return cat.villas.map(c => mk(c, 'villa')).concat(cat.apts.map(c => mk(c, 'apartamento')));
}
